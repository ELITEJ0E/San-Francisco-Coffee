<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="latteShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#78350F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgLatte)"/>
  <ellipse cx="200" cy="355" rx="90" ry="16" fill="#78350F" opacity="0.15"/>

  <g filter="url(#latteShadow)">
    <!-- Saucer -->
    <ellipse cx="200" cy="310" rx="120" ry="35" fill="url(#cupGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <ellipse cx="200" cy="308" rx="80" ry="20" fill="#E2E8F0"/>

    <!-- Cup Handle -->
    <path d="M260 200 C310 200, 310 270, 255 270" fill="none" stroke="url(#cupGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Cup Body -->
    <path d="M120 170 C120 280, 150 310, 200 310 C250 310, 280 280, 280 170 Z" fill="url(#cupGrad)" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- SF Red Stamp -->
    <rect x="175" y="215" width="50" height="45" rx="8" fill="#C51E28"/>
    <text x="200" y="244" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">SF</text>
    <text x="200" y="254" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6" fill="#FED7AA" text-anchor="middle">COFFEE</text>

    <!-- Coffee Top Surface -->
    <ellipse cx="200" cy="170" rx="80" ry="28" fill="#78350F"/>
    <ellipse cx="200" cy="170" rx="72" ry="24" fill="#9A3412"/>

    <!-- Latte Art Heart -->
    <path d="M200 185 C190 170, 165 160, 175 145 C185 135, 198 148, 200 155 C202 148, 215 135, 225 145 C235 160, 210 170, 200 185 Z" fill="#FFFFFF"/>
    <path d="M200 150 L200 190" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
