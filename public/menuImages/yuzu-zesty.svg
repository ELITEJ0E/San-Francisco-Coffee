<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep red-orange studio backdrop matching Item 4 in screenshot -->
    <linearGradient id="bgGradYuzuDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="yuzuLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="85%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <filter id="shadowY" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#450A0A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#bgGradYuzuDark)"/>
  <ellipse cx="200" cy="340" rx="90" ry="18" fill="#450A0A" opacity="0.5"/>

  <!-- Yuzu/lemon wheel at bottom right -->
  <g transform="translate(245, 275)">
    <circle cx="35" cy="35" r="32" fill="#FACC15" stroke="#FEF08A" stroke-width="4"/>
    <circle cx="35" cy="35" r="24" fill="#FEF08A"/>
    <path d="M35 11 L35 59 M11 35 L59 35 M18 18 L52 52 M18 52 L52 18" stroke="#EAB308" stroke-width="3"/>
  </g>

  <g filter="url(#shadowY)">
    <path d="M140 135 L155 330 Q155 338 165 338 L235 338 Q245 338 245 330 L260 135 Z" fill="url(#yuzuLiquid)"/>
    
    <!-- Ice and layers -->
    <rect x="160" y="180" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.65"/>
    <rect x="202" y="225" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.55"/>
    
    <rect x="175" y="210" width="50" height="50" rx="10" fill="#BA1C24"/>
    <text x="200" y="242" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">SF</text>
    <text x="200" y="254" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="#FEF08A" text-anchor="middle">COFFEE</text>

    <!-- Whipped Cream & Lime/Mint -->
    <path d="M136 138 C135 110, 160 85, 185 95 C195 75, 225 72, 240 92 C260 85, 272 108, 264 138 Z" fill="#FFFDF7"/>
    <path d="M175 95 C185 80, 215 78, 225 95 Z" fill="#FFFFFF"/>
    
    <!-- Red Straw -->
    <rect x="210" y="30" width="10" height="95" rx="5" fill="#BA1C24" transform="rotate(12 215 80)"/>
    <ellipse cx="200" cy="136" rx="63" ry="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
</svg>
