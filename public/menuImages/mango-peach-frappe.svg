<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="warmStudioBgMango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="mangoSwirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#451A03" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="36" fill="url(#warmStudioBgMango)"/>
  <ellipse cx="200" cy="340" rx="90" ry="18" fill="#451A03" opacity="0.45"/>

  <!-- Mango fruit slice at bottom right -->
  <g transform="translate(240, 280) rotate(-15)">
    <path d="M10 40 Q40 5 80 20 Q100 50 70 65 Q30 75 10 40 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <path d="M18 40 Q40 18 70 30 Q85 50 62 60 Q32 68 18 40 Z" fill="#FBBF24"/>
  </g>

  <g filter="url(#shadowM)">
    <path d="M140 135 L155 330 Q155 338 165 338 L235 338 Q245 338 245 330 L260 135 Z" fill="url(#mangoSwirl)"/>
    <path d="M143 175 Q170 190 200 170 T257 185 L254 210 Q225 230 195 205 T146 215 Z" fill="#FFFFFF" opacity="0.85"/>
    
    <rect x="175" y="210" width="50" height="50" rx="10" fill="#BA1C24"/>
    <text x="200" y="242" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">SF</text>
    <text x="200" y="254" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="#FEF08A" text-anchor="middle">COFFEE</text>

    <!-- Whipped Cream Swirl -->
    <path d="M136 138 C135 110, 160 85, 185 95 C195 75, 225 72, 240 92 C260 85, 272 108, 264 138 Z" fill="#FFFDF7"/>
    <path d="M175 95 C185 80, 215 78, 225 95 Z" fill="#FFFFFF"/>
    
    <!-- Red Straw -->
    <rect x="210" y="30" width="10" height="95" rx="5" fill="#BA1C24" transform="rotate(12 215 80)"/>
    <ellipse cx="200" cy="136" rx="63" ry="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
</svg>
