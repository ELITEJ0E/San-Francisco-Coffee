    <!-- Red crumbs on top -->
    <circle cx="180" cy="165" r="3" fill="#BE123C"/>
    <circle cx="210" cy="180" r="2.5" fill="#BE123C"/>
    <circle cx="240" cy="190" r="3" fill="#BE123C"/>
