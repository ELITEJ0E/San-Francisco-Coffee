  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgRedV)"/>
  <ellipse cx="200" cy="240" rx="140" ry="90" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="4"/>

  <!-- Red Velvet Cake Slice -->
