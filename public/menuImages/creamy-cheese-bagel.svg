<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBagel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="bagelCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="bagelShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgBagel)"/>
  
  <!-- Plate -->
  <ellipse cx="200" cy="220" rx="140" ry="110" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="4"/>
  <ellipse cx="200" cy="220" rx="115" ry="90" fill="#F8FAFC"/>

  <!-- Bagel Outer Ring -->
  <g filter="url(#bagelShadow)">
    <path d="M200 130 C250 130, 285 165, 285 210 C285 255, 245 285, 200 285 C155 285, 115 255, 115 210 C115 165, 150 130, 200 130 Z" fill="url(#bagelCrust)"/>
    
    <!-- Bagel Hole -->
    <ellipse cx="200" cy="210" rx="32" ry="26" fill="#F8FAFC"/>
    
    <!-- Cream Cheese Filling oozing out -->
    <path d="M125 215 Q145 228 170 218 Q190 235 220 220 Q250 232 275 215 C265 240, 230 255, 200 255 C165 255, 135 240, 125 215 Z" fill="#FFFFFF"/>
    
    <!-- Sesame seeds -->
    <circle cx="160" cy="160" r="3" fill="#FEF3C7"/>
    <circle cx="180" cy="150" r="3" fill="#FEF3C7"/>
    <circle cx="230" cy="155" r="3" fill="#FEF3C7"/>
    <circle cx="250" cy="175" r="3" fill="#FEF3C7"/>
    <circle cx="140" cy="190" r="3" fill="#FEF3C7"/>
    <circle cx="260" cy="220" r="3" fill="#FEF3C7"/>
  </g>
</svg>
