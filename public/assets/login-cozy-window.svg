<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3525"/>
      <stop offset="50%" stop-color="#312015"/>
      <stop offset="100%" stop-color="#1E130B"/>
    </linearGradient>
    <linearGradient id="window-light" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F5EBE1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="coffee-pour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA1C24"/>
      <stop offset="100%" stop-color="#8C1117"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="240" rx="20" fill="url(#bg-grad)"/>

  <!-- Window Frame in Background -->
  <rect x="30" y="20" width="340" height="140" rx="12" fill="url(#window-light)"/>
  <line x1="200" y1="20" x2="200" y2="160" stroke="#D1C4B5" stroke-width="4"/>
  <line x1="30" y1="90" x2="370" y2="90" stroke="#D1C4B5" stroke-width="3"/>

  <!-- Outside Trees / Soft Greenery Blur through window -->
  <circle cx="90" cy="70" r="35" fill="#A8C3A0" opacity="0.6"/>
  <circle cx="140" cy="60" r="25" fill="#88A87F" opacity="0.5"/>
  <circle cx="280" cy="75" r="40" fill="#A8C3A0" opacity="0.6"/>

  <!-- Cozy Wooden Table Surface -->
  <path d="M0 150 L400 150 L400 240 L0 240 Z" fill="#2E1C12"/>
  <rect x="0" y="150" width="400" height="8" fill="#422C1D"/>
  <line x1="0" y1="158" x2="400" y2="158" stroke="#1F120A" stroke-width="2"/>

  <!-- Coffee Cups & Plate on Table -->
  <!-- Ceramic Plate -->
  <ellipse cx="140" cy="195" rx="42" ry="16" fill="#EAE5DE" filter="url(#shadow)"/>
  <ellipse cx="140" cy="195" rx="34" ry="12" fill="#F6F3EE"/>
  
  <!-- Croissant on Plate -->
  <path d="M115 195 C120 185 135 183 145 188 C155 183 165 188 168 196 C160 200 145 202 135 199 C125 201 116 199 115 195 Z" fill="#D4863B"/>
  <path d="M125 192 C132 186 142 187 148 192" stroke="#B06520" stroke-width="2" stroke-linecap="round"/>
  <path d="M142 191 C148 186 156 187 160 192" stroke="#B06520" stroke-width="2" stroke-linecap="round"/>

  <!-- Red SF Coffee Ceramic Mug -->
  <g filter="url(#shadow)">
    <!-- Plate under Mug -->
    <ellipse cx="260" cy="202" rx="30" ry="10" fill="#EAE5DE"/>
    <!-- Mug Body -->
    <rect x="238" y="165" width="44" height="34" rx="6" fill="url(#coffee-pour)"/>
    <ellipse cx="260" cy="165" rx="22" ry="6" fill="#3D2314"/>
    <!-- Latte Art Heart -->
    <path d="M256 164 C256 161 253 160 251 162 C249 160 246 161 246 164 C246 167 251 169 251 170 C251 169 256 167 256 164 Z" fill="#F5EBE1" transform="scale(1.2) translate(-40, -5)"/>
    <!-- Handle -->
    <path d="M282 172 C292 172 292 190 282 190" stroke="#BA1C24" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- SF White Logo Accent on Mug -->
    <rect x="252" y="176" width="16" height="14" rx="2" fill="#FFFFFF"/>
    <text x="260" y="186" font-family="sans-serif" font-size="7" font-weight="900" fill="#BA1C24" text-anchor="middle">SF</text>
  </g>

  <!-- Steam Wisp -->
  <path d="M255 155 C252 145 262 140 258 130" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M266 157 C263 149 271 144 268 136" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
