<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Stars / Celebration Sparks above -->
  <!-- Star 1 Left (Blue outline star) -->
  <path d="M 42 34 L 46 43 L 55 44 L 48 51 L 50 60 L 42 55 L 34 60 L 36 51 L 29 44 L 38 43 Z" fill="none" stroke="#4A6CF7" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- Star 2 Right (Blue outline star) -->
  <path d="M 98 24 L 102 33 L 111 34 L 104 41 L 106 50 L 98 45 L 90 50 L 92 41 L 85 34 L 94 33 Z" fill="none" stroke="#4A6CF7" stroke-width="1.8" stroke-linejoin="round"/>
  
  <!-- Little celebration spark lines -->
  <line x1="72" y1="20" x2="72" y2="12" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="25" x2="56" y2="20" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="25" x2="88" y2="20" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Arm & Cup -->
  <g filter="url(#glow)">
    <!-- Arm reaching in from bottom left -->
    <path d="M -5 145 L 36 102 L 52 118 L 10 165 Z" fill="#D27E58"/>
    <!-- Watch strap & dial -->
    <rect x="22" y="112" width="16" height="12" rx="2" fill="#58311B" transform="rotate(-40 22 112)"/>
    <circle cx="28" cy="116" r="4.5" fill="#3D2010"/>
    <circle cx="28" cy="116" r="3" fill="#D4AF37"/>

    <!-- Hand fingers wrapping around cup -->
    <path d="M 38 102 C 44 95 50 94 54 99 C 56 103 54 110 48 114 Z" fill="#C46E4A"/>

    <!-- Left Cup (Beige with red corrugated sleeve & red lid) -->
    <g transform="translate(36, 44) rotate(14)">
      <!-- Cup Body -->
      <path d="M 6 18 L 12 80 L 38 80 L 44 18 Z" fill="#FBF8F4"/>
      <!-- Red Corrugated Sleeve -->
      <path d="M 8 32 L 11 60 L 39 60 L 42 32 Z" fill="#E63946"/>
      <!-- Sleeve vertical ridges -->
      <line x1="12" y1="33" x2="14" y2="59" stroke="#C82333" stroke-width="1"/>
      <line x1="16" y1="33" x2="18" y2="59" stroke="#C82333" stroke-width="1"/>
      <line x1="20" y1="33" x2="22" y2="59" stroke="#C82333" stroke-width="1"/>
      <line x1="24" y1="33" x2="26" y2="59" stroke="#C82333" stroke-width="1"/>
      <line x1="28" y1="33" x2="30" y2="59" stroke="#C82333" stroke-width="1"/>
      <line x1="32" y1="33" x2="34" y2="59" stroke="#C82333" stroke-width="1"/>
      <line x1="36" y1="33" x2="38" y2="59" stroke="#C82333" stroke-width="1"/>
      <!-- Red Lid -->
      <rect x="4" y="14" width="42" height="7" rx="3.5" fill="#E63946"/>
      <path d="M 10 14 C 10 7 40 7 40 14 Z" fill="#F4A261"/>
    </g>
  </g>

  <!-- Right Arm & Cup -->
  <g filter="url(#glow)">
    <!-- Arm reaching from bottom right -->
    <path d="M 165 145 L 124 102 L 108 118 L 150 165 Z" fill="#8C4A2F"/>
    
    <!-- Gold Heart Bracelet -->
    <path d="M 125 106 Q 130 114 135 122" stroke="#FFC72C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="127" cy="111" r="2.5" fill="#FFC72C"/>
    <circle cx="132" cy="118" r="2.5" fill="#FFC72C"/>

    <!-- Hand fingers wrapping around cup -->
    <path d="M 122 102 C 116 95 110 94 106 99 C 104 103 106 110 112 114 Z" fill="#783B22"/>

    <!-- Right Cup (Beige with purple striped sleeve & purple lid) -->
    <g transform="translate(80, 48) rotate(-16)">
      <!-- Cup Body -->
      <path d="M 6 18 L 12 80 L 38 80 L 44 18 Z" fill="#FBF8F4"/>
      <!-- Purple Sleeve with subtle stripes -->
      <path d="M 8 32 L 11 60 L 39 60 L 42 32 Z" fill="#8A4FFF"/>
      <line x1="12" y1="33" x2="14" y2="59" stroke="#7132ED" stroke-width="1"/>
      <line x1="17" y1="33" x2="19" y2="59" stroke="#7132ED" stroke-width="1"/>
      <line x1="22" y1="33" x2="24" y2="59" stroke="#7132ED" stroke-width="1"/>
      <line x1="27" y1="33" x2="29" y2="59" stroke="#7132ED" stroke-width="1"/>
      <line x1="32" y1="33" x2="34" y2="59" stroke="#7132ED" stroke-width="1"/>
      <line x1="37" y1="33" x2="39" y2="59" stroke="#7132ED" stroke-width="1"/>
      <!-- Purple Lid -->
      <rect x="4" y="14" width="42" height="7" rx="3.5" fill="#8A4FFF"/>
      <path d="M 10 14 C 10 7 40 7 40 14 Z" fill="#FFD166"/>
    </g>
  </g>
</svg>
