<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Garden Green Bokeh Background -->
    <radialGradient id="gardenBokeh" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4F7942"/>
      <stop offset="40%" stop-color="#3B5E30"/>
      <stop offset="100%" stop-color="#1E3317"/>
    </radialGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <clipPath id="newsClip">
      <rect width="600" height="340" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#newsClip)">
    <!-- Garden Background -->
    <rect width="600" height="340" fill="url(#gardenBokeh)"/>

    <!-- Bokeh Orbs -->
    <circle cx="120" cy="90" r="45" fill="#88B868" opacity="0.3" filter="blur(15px)"/>
    <circle cx="480" cy="110" r="60" fill="#AED581" opacity="0.25" filter="blur(20px)"/>
    <circle cx="300" cy="60" r="40" fill="#E8F5E9" opacity="0.2" filter="blur(18px)"/>
    <circle cx="70" cy="220" r="50" fill="#558B2F" opacity="0.3" filter="blur(15px)"/>

    <!-- Top Headline: "Bite into Bliss!" -->
    <g transform="translate(300, 50)">
      <text x="0" y="0" font-family="'Signika', 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5" filter="url(#softGlow)">Bite into Bliss!</text>
    </g>

    <!-- Red Banner Ribbon: "Buy ANY cookie for only RM4 with any drinks purchase." -->
    <g transform="translate(300, 92)">
      <rect x="-240" y="-18" width="480" height="32" rx="4" fill="#C8102E"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">Buy ANY cookie for only RM4 with any drinks purchase.</text>
    </g>

    <!-- Hands, Drink Cup & Cookie in Bag -->
    <!-- Left Hand Holding White SF Coffee Cup with Red Lid -->
    <g transform="translate(110, 135)" filter="url(#softGlow)">
      <!-- Left Hand -->
      <path d="M -10 160 Q 50 140 75 90 L 88 125 Q 40 180 -10 190 Z" fill="#DDB296"/>
      <path d="M 68 85 C 80 80 88 88 84 98 C 80 106 72 108 65 98 Z" fill="#C99878"/>

      <!-- Coffee Cup -->
      <g transform="translate(20, 20) rotate(-6)">
        <!-- Cup Body (White) -->
        <path d="M 8 32 L 18 160 L 78 160 L 88 32 Z" fill="#FFFFFF"/>
        
        <!-- SF COFFEE Red Logo on Cup -->
        <rect x="26" y="70" width="44" height="44" rx="6" fill="#C8102E"/>
        <text x="48" y="91" font-family="sans-serif" font-weight="900" font-size="14.5" fill="#FFFFFF" text-anchor="middle">SF</text>
        <text x="48" y="104" font-family="sans-serif" font-weight="800" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">COFFEE</text>

        <!-- Red Cup Lid -->
        <rect x="2" y="24" width="92" height="10" rx="5" fill="#E62E3B"/>
        <path d="M 12 24 C 12 12 84 12 84 24 Z" fill="#C8102E"/>
        <rect x="36" y="14" width="24" height="4" rx="2" fill="#BA1C24"/>
      </g>
    </g>

    <!-- Right Hand Holding Red Paper Cookie Bag with Chocolate Chip Cookie -->
    <g transform="translate(280, 130)" filter="url(#softGlow)">
      <!-- Right Hand -->
      <path d="M 230 170 Q 170 140 135 110 L 125 140 Q 160 185 220 200 Z" fill="#C99878"/>
      <path d="M 142 105 C 132 100 126 108 128 118 C 132 124 140 125 146 116 Z" fill="#B38060"/>

      <!-- Large Chocolate Chip Cookie peaking out -->
      <g transform="translate(95, 10)">
        <!-- Cookie Disc -->
        <circle cx="55" cy="55" r="48" fill="#C68A4C"/>
        <circle cx="55" cy="55" r="46" fill="#BA7A3B" stroke="#9A602B" stroke-width="3" stroke-dasharray="14 4 10 6"/>

        <!-- Chocolate Chunks & Chips -->
        <ellipse cx="40" cy="40" rx="8" ry="6" fill="#3D2010"/>
        <ellipse cx="68" cy="46" rx="7" ry="9" fill="#361B0D"/>
        <ellipse cx="50" cy="68" rx="9" ry="7" fill="#3D2010"/>
        <ellipse cx="32" cy="62" rx="5" ry="4" fill="#3D2010"/>
        <ellipse cx="78" cy="64" rx="6" ry="5" fill="#361B0D"/>
        <ellipse cx="55" cy="24" rx="5" ry="4" fill="#361B0D"/>

        <!-- Sea Salt crystals -->
        <rect x="44" y="32" width="4" height="2" fill="#FFF8EE" rx="1"/>
        <rect x="62" y="58" width="4" height="2" fill="#FFF8EE" rx="1"/>
      </g>

      <!-- Red Paper Bag -->
      <g transform="translate(45, 45) rotate(12)">
        <path d="M 10 40 L 25 170 L 135 170 L 150 40 L 80 55 Z" fill="#E62E3B"/>
        <path d="M 12 42 L 25 168 L 133 168 L 148 42 L 80 54 Z" fill="#D31D2A"/>
        
        <!-- Small SF Logo on bag -->
        <rect x="62" y="70" width="22" height="22" rx="3" fill="#FFFFFF"/>
        <text x="73" y="81" font-family="sans-serif" font-weight="900" font-size="7" fill="#C8102E" text-anchor="middle">SF</text>
        <text x="73" y="88" font-family="sans-serif" font-weight="800" font-size="3" fill="#C8102E" text-anchor="middle">COFFEE</text>

        <!-- "COOKIE" Bold Text on Bag -->
        <text x="75" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">COOKIE</text>
      </g>

      <!-- "RM4 ONLY!" Comic Starburst Sticker Badge -->
      <g transform="translate(100, 15) rotate(-12)" filter="url(#softGlow)">
        <ellipse cx="35" cy="18" rx="46" ry="24" fill="#FFFFFF"/>
        <ellipse cx="35" cy="18" rx="42" ry="20" fill="#FFFFFF" stroke="#3D2010" stroke-width="1.5" stroke-dasharray="8 4"/>
        <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#1C242B" text-anchor="middle" letter-spacing="-0.5">RM4 ONLY!</text>
      </g>
    </g>

    <!-- SF COFFEE logo in bottom right -->
    <g transform="translate(540, 280)">
      <rect width="36" height="36" rx="6" fill="#C8102E"/>
      <text x="18" y="18" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">SF</text>
      <text x="18" y="29" font-family="sans-serif" font-weight="800" font-size="5.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">COFFEE</text>
    </g>
  </g>
</svg>
