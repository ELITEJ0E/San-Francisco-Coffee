<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Soft leaf shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3E2712" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Leaves -->
  <path d="M 68 18 C 65 32 72 45 68 55 C 64 45 60 32 68 18 Z" fill="#E8ECE9" opacity="0.85"/>
  <path d="M 76 28 C 88 24 98 32 94 44 C 84 42 78 35 76 28 Z" fill="#E8ECE9" opacity="0.85"/>
  <path d="M 40 48 C 30 55 24 68 32 78 C 36 68 38 58 40 48 Z" fill="#E8ECE9" opacity="0.7"/>
  <path d="M 130 70 C 138 78 142 92 135 102 C 130 92 128 82 130 70 Z" fill="#E8ECE9" opacity="0.7"/>

  <!-- Coffee Beans Floating -->
  <!-- Bean 1 -->
  <g transform="translate(52, 28) rotate(-25)">
    <ellipse cx="6" cy="8" rx="6" ry="8" fill="#4B3322"/>
    <path d="M 6 1 Q 7 8 6 15" stroke="#F5EDE6" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Bean 2 -->
  <g transform="translate(78, 36) rotate(35)">
    <ellipse cx="5" cy="7" rx="5" ry="7" fill="#3D2817"/>
    <path d="M 5 1 Q 4 7 5 13" stroke="#F5EDE6" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Cup (Tilted slightly right, striped beige & grey, black lid) -->
  <g transform="translate(85, 30) rotate(14)" filter="url(#softGlow)">
    <!-- Cup Body -->
    <path d="M 8 30 L 14 110 L 46 110 L 52 30 Z" fill="#F4F1ED"/>
    <!-- Stripes -->
    <path d="M 9.5 45 L 10.5 58 L 49.5 58 L 50.5 45 Z" fill="#D3CBC2"/>
    <path d="M 11.5 72 L 12.5 85 L 47.5 85 L 48.5 72 Z" fill="#D3CBC2"/>
    <path d="M 13.5 98 L 14 108 L 46 108 L 46.5 98 Z" fill="#D3CBC2"/>
    
    <!-- Cup Rim & Lid -->
    <rect x="5" y="24" width="50" height="8" rx="3" fill="#1C242B"/>
    <path d="M 12 24 C 12 16 48 16 48 24 Z" fill="#29323B"/>
    <rect x="25" y="16" width="10" height="3" rx="1.5" fill="#3D4752"/>
  </g>

  <!-- Left Cup (Dark brown, with brown sleeve and "Coffee" script, black lid) -->
  <g transform="translate(20, 48) rotate(-10)" filter="url(#softGlow)">
    <!-- Cup Body -->
    <path d="M 8 32 L 15 110 L 49 110 L 56 32 Z" fill="#4B3322"/>
    
    <!-- Kraft Sleeve -->
    <path d="M 10 52 L 13 86 L 51 86 L 54 52 Z" fill="#785942"/>
    <path d="M 10 52 L 54 52" stroke="#684C37" stroke-width="1.5"/>
    <path d="M 13 86 L 51 86" stroke="#684C37" stroke-width="1.5"/>

    <!-- "Coffee" white handwriting text -->
    <text x="32" y="72" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Coffee</text>

    <!-- Cup Rim & Lid -->
    <rect x="5" y="24" width="54" height="8" rx="3" fill="#1A2027"/>
    <path d="M 12 24 C 12 16 52 16 52 24 Z" fill="#29323B"/>
    <rect x="27" y="16" width="10" height="3" rx="1.5" fill="#3E4A56"/>
  </g>
</svg>
